[project]
name = "trazezzo"
version = "0.2.0"
description = "AI-native server operations platform — Cockpit OS + black box recorder + proactive agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.28",
    "pydantic>=2.10",
    "psutil>=6.1",
    "websockets>=14",
]

[project.scripts]
trazezzo = "trazezzo.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trazezzo"]

[tool.uv]
dev-dependencies = []
