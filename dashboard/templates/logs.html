{% extends "base.html" %}
{% block title %}Trazezzo — Logs{% endblock %}
{% block content %}
<div class="page-header">
 <h2>Journal Logs</h2>
 <div class="desc">Last {{ logs | length }} entries from systemd journal</div>
</div>

<div class="card">
 <div style="display: flex; gap: 12px; margin-bottom: 12px; align-items: center;">
 <input type="text" id="logSearch" placeholder="Filter logs..." style="flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px;">
 <select id="logPriority" style="padding: 8px; border: 1px solid var(--border); border-radius: 6px;">
 <option value="">All priorities</option>
 <option value="emerg">Emergency</option>
 <option value="err">Error</option>
 <option value="warning">Warning</option>
 <option value="info">Info</option>
 </select>
 <button class="btn btn-primary" onclick="refreshLogs()">Refresh</button>
 </div>
 <div id="logContainer" style="background: #0f172a; color: #e2e8f0; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; max-height: 70vh; overflow-y: auto;">
 {% for log in logs %}
 <div class="line">{{ log.line }}</div>
 {% endfor %}
 </div>
</div>

<script>
function refreshLogs() {
 const priority = document.getElementById('logPriority').value;
 fetch(`/trazezzo/api/logs?lines=200${priority ? '&priority=' + priority : ''}`)
 .then(r => r.json())
 .then(data => {
 const container = document.getElementById('logContainer');
 container.innerHTML = data.logs.map(l => `<div class="line">${l.line}</div>`).join('');
 });
}
document.getElementById('logSearch').addEventListener('input', e => {
 const q = e.target.value.toLowerCase();
 document.querySelectorAll('#logContainer .line').forEach(line => {
 line.style.display = line.textContent.toLowerCase().includes(q) ? '' : 'none';
 });
});
</script>
{% endblock %}
